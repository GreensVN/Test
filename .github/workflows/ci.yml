name: CI - Trợ lý ảo tiếng Việt

on:
  push:
    branches: [ main, arena/* ]
  # Stacked PRs target arena/* rather than main; do not silently skip them.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUTF8: "1"

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        # v7.2: thêm 3.13 - pyproject.toml đã quảng cáo "Programming Language ::
        # Python :: 3.13" nhưng CI chưa từng kiểm tra một bản nào.
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      # v5: setup-python@v4 chạy trên Node 16 đã bị GitHub khai tử (warning +
      # nguy cơ hết hỗ trợ), v5 dùng Node 20 và cache pip chuẩn hơn.
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: pip

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install -r vi_voice_assistant/requirements.txt
        python -m pip install pytest

    # v7.2 - SỬA LỖI "CI XANH GIẢ": bước test trước đây là
    #     pytest tests/ -v --tb=short || python run_tests.py
    # Dấu `||` nghĩa là "nếu pytest FAIL thì chạy tiếp run_tests.py", và kết
    # quả cuối cùng quyết định màu of CI. Chỉ cần run_tests.py (dùng runner nhúng,
    # bớt khắt khe hơn pytest) xanh là CI XANH DÙ TOÀN BỘ pytest ĐỎ.
    # Từ đây mỗi bộ test là một bước riêng, bước nào đỏ làm CI đỏ.
    - name: Test with run_tests.py (built-in runner)
      working-directory: vi_voice_assistant
      run: python run_tests.py

    - name: Test with pytest
      working-directory: vi_voice_assistant
      run: python -m pytest tests/ -v --tb=short

    - name: Smoke test CLI (--version / --sysinfo / --once)
      working-directory: vi_voice_assistant
      run: |
        python main.py --version
        python main.py --sysinfo
        python main.py --once "mở youtube" --dry-run --json
        python main.py --once "15 cộng 27 bằng bao nhiêu" --dry-run --json

  # v7.2 - BƯỚC TĨNH (lint/type) MỚI: pyproject.toml đã khai báo [tool.ruff] và
  # [tool.mypy] từ bản 7.0 nhưng chưa lần nào được CI chạy, nên 347 cảnh báo
  # (bao gồm 2 lỗi F821 "tên không tồn tại" thật) tích tụ không ai thấy.
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: pip
    - name: Install ruff
      run: |
        python -m pip install --upgrade pip
        python -m pip install "ruff>=0.5.0"
    - name: ruff check
      run: ruff check .

  # v7.4: mypy tu 60 loi -> 0 va CI giu muc do. [tool.mypy] trong pyproject.toml
  # da bat check_untyped_defs/warn_return_any/warn_unused_ignores - co that muc
  # nay thi "sua kieu" khong con la viec tu nguyen.
  typecheck:
    name: Type check (mypy)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: pip
    - name: Install mypy
      run: |
        python -m pip install --upgrade pip
        python -m pip install "mypy>=1.11"
    - name: mypy (package + install.py)
      run: |
        mypy --version
        mypy vi_voice_assistant install.py

  # Chạy được cả khi CHƯA cài scikit-learn: đây là hợp đồng cốt lõi của dự án
  # (lite_model.py). Nếu môi trường tối giản sập nghĩa là lỗi import mềm bị hồi quy.
  no-deps:
    name: Test without optional deps (chỉ stdlib)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Test with pytest
      run: |
        python -m pip install pytest
        cd vi_voice_assistant && python -m pytest tests/ -q
    - name: CLI smoke
      working-directory: vi_voice_assistant
      run: |
        python main.py --version
        python main.py --doctor
        python main.py --once "mở google" --dry-run --json
        python main.py "15 cộng 27 bằng bao nhiêu" --dry-run
        python diagnostic.py --json > /tmp/doctor.json
        python -c "import json;print('doctor json ok' if json.load(open('/tmp/doctor.json')) else '')"

  # v7.3 - runner nhúng PHẢI chạy được khi máy không có pytest (đó là lý do nó
  # tồn tại). Thêm job riêng vì từ trước tới nay không môi trường nào trong CI
  # thiếu pytest, nên các lỗi kiểu "runner báo missing argument: caplog" hoặc
  # parametrize bị bung thành từng ký tự không ai thấy.
  embedded-runner:
    name: Built-in runner (không có pytest)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Run run_tests.py (no pytest installed)
      # VI_TESTS_FORCE_EMBEDDED: buoc chay bang runner nhung DU moi truong co
      # pytest san (image cua GitHub co the doi). Neu khong co co nay, job nay
      # im lang uy quyen cho pytest va khong con kiem thu phan nhung nua -
      # dung cai lop ma no sinh ra de phong.
      env:
        VI_TESTS_FORCE_EMBEDDED: "1"
      shell: bash
      working-directory: vi_voice_assistant
      run: |
        python -m pip install pytest          # co y cai: van phai dung runner
        python run_tests.py -q

  # v7.3 - KIỂM TRA CÁI MÀ KHÔNG AI KIỂM TRA: bản cài đặt thật.
  # `pip install .` của v7.2 tạo wheel ĐỦ FILE nhưng DÙNG KHÔNG ĐƯỢC
  # (ModuleNotFoundError: No module named 'platform_utils'), README vẫn khoe
  # "pip install -e ." được - bằng chứng là CI chưa từng cài thử.
  install:
    name: pip install + console scripts (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Install from the repo (no deps required)
      run: |
        python -m pip install --upgrade pip
        python -m pip install .
    - name: Console scripts must run
      shell: bash
      working-directory: ${{ runner.temp }}
      run: |
        vi-assistant --version
        vi-assistant --doctor
        vi-assistant --dry-run --once "mở youtube"
        vi-doctor --json > doctor.json
        python -c "import json;d=json.load(open('doctor.json', encoding='utf-8'));print('ok' if d['sections'] else 'empty')"
    - name: Module entry point + run from another cwd
      shell: bash
      working-directory: ${{ github.workspace }}
      run: |
        cd ~
        python -m vi_voice_assistant --version
    - name: Installed version and strict JSON CLI (outside the repo)
      shell: bash
      working-directory: ${{ runner.temp }}
      run: |
        python - <<'PY'
        import json
        import os
        import pathlib
        import shutil
        import subprocess
        import sys
        import tempfile
        from importlib.metadata import version

        import vi_voice_assistant
        import vi_voice_assistant.main as cli

        assert version("vi-voice-assistant") == vi_voice_assistant.__version__ == cli.APP_VERSION
        script = shutil.which("vi-assistant")
        assert script, "console script missing"

        def no_nonfinite(value):
            raise AssertionError(f"non-standard JSON number: {value}")

        with tempfile.TemporaryDirectory() as directory:
            env = dict(os.environ, VI_ASSISTANT_HOME=str(pathlib.Path(directory) / "data"))
            for entry in ([sys.executable, "-m", "vi_voice_assistant"], [script]):
                cases = (("15 + 27", True, 0), ("", True, 0),
                         ("đừng tắt máy tính", True, 0), ("đừng tắt máy tính", False, 2))
                for text, dry_run, expected_code in cases:
                    command = [*entry, "--once", text, "--json"]
                    if dry_run:
                        command.append("--dry-run")
                    result = subprocess.run(
                        command,
                        capture_output=True, text=True, encoding="utf-8", env=env, timeout=120)
                    assert result.returncode == expected_code, result.stdout + result.stderr
                    body = json.loads(result.stdout, parse_constant=no_nonfinite)
                    if not text:
                        assert body == [], body
                    elif text == "15 + 27":
                        assert len(body) == 1 and body[0]["result"] == 42, body
                    else:
                        assert len(body) == 1 and body[0]["status"] == "unknown", body
        print("installed metadata/API/CLI versions match; JSON stdout is clean")
        PY
    - name: Installed assistant safety and persistence
      shell: bash
      working-directory: ${{ runner.temp }}
      run: |
        python - <<'PY'
        import contextlib
        import datetime
        import io
        import json
        import pathlib
        import sys
        import tempfile
        from unittest import mock
        import vi_voice_assistant.executor as executor
        import vi_voice_assistant.main as cli
        import vi_voice_assistant.nlu_advanced as nlu
        import vi_voice_assistant.paths as storage
        from vi_voice_assistant.csv_utils import read_keyed_csv

        memory = nlu.ContextMemory(0)
        memory.remember({"target": "google"})
        assert memory.history == []
        memory = nlu.ContextMemory()
        target = "https://example.com/no/AbC"
        payload = {"target": target}
        memory.remember(payload)
        payload["target"] = "changed"
        assert memory.resolve("MỞ NÓ") == "MỞ " + target
        assert memory.resolve("mở https://other.com/no") == "mở https://other.com/no"
        nlu.CONFIDENCE_ASK = nlu.CONFIDENCE_ACCEPT = 0.0
        assert nlu.NLU._judge({"intent": "system_control", "target": "shutdown",
                               "confidence": 0.0}) == "unknown"
        with tempfile.TemporaryDirectory() as directory:
            path = pathlib.Path(directory) / "private" / "feedback.csv"
            nlu.FEEDBACK_PATH = str(path)
            assert nlu.log_feedback("mở chrome", "open_app", 1.0, correct=True) is True
            rows = read_keyed_csv(path, ("time", "text", "intent", "confidence", "verified"))
            assert rows[0]["text"] == "mở chrome" and rows[0]["verified"] == "1"
            blocked = pathlib.Path(directory) / "blocked"
            blocked.mkdir()
            nlu.FEEDBACK_PATH = str(blocked)
            message = nlu.NLU.__new__(nlu.NLU).teach("mở chrome", "open_app")
            assert "Đã ghi nhớ" not in message
        with tempfile.TemporaryDirectory() as directory, contextlib.ExitStack() as patches:
            path = pathlib.Path(directory) / "reminders.json"
            timers, fail_start = [], [False]

            class Timer:
                def __init__(self, delay, callback, args=()):
                    self.callback, self.args = callback, args
                    self.daemon = False
                    timers.append(self)

                def start(self):
                    if fail_start[0]:
                        raise RuntimeError("simulated thread exhaustion")

                def cancel(self):
                    pass

                def fire(self):
                    self.callback(*self.args)

            patches.enter_context(mock.patch.object(executor.threading, "Timer", Timer))
            patches.enter_context(mock.patch.object(executor, "ACTIVE_REMINDERS", []))
            patches.enter_context(mock.patch.object(executor, "REMINDERS_PATH", path))
            executor._schedule_reminder("saved", datetime.datetime.now()
                                        + datetime.timedelta(days=3))
            timers[0].fire()
            timers[0].fire()
            assert len(timers) == 2 and len(executor.ACTIVE_REMINDERS) == 1
            fail_start[0] = True
            timers[1].fire()
            assert executor.ACTIVE_REMINDERS[0]["timer"] is None
            assert executor.ACTIVE_REMINDERS[0]["_timer_error"]
            saved = path.read_bytes()
            executor.cancel_reminder()
            path.write_bytes(saved)
            assert executor.restore_reminders() == 0
            assert len(json.loads(path.read_text(encoding="utf-8"))) == 1
            fail_start[0] = False
            assert executor.restore_reminders() == 1
            assert executor.restore_reminders() == 0
            executor.cancel_reminder()
        with tempfile.TemporaryDirectory() as directory:
            marker = pathlib.Path(directory) / "confirmed.txt"
            failed = [sys.executable, "-c", "raise SystemExit(7)"]
            assert executor._run_first_available([failed]) is False
            code = "from pathlib import Path; Path(" + repr(str(marker)) + ").write_text('ok')"
            assert executor._run_first_available([failed, [sys.executable, "-c", code]]) is True
            assert marker.read_text() == "ok"
        for bad in (10 ** 1000, -10 ** 1000, 1.5, True):
            assert executor._read_confidence(bad) == -1.0
            assert nlu._as_confidence(bad) == 0.0
            assert nlu.NLU._judge({"intent": "system_control", "target": "lock",
                                   "confidence": bad}) == "unknown"
        with tempfile.TemporaryDirectory() as directory, contextlib.ExitStack() as patches:
            root = pathlib.Path(directory)
            history = root / "history.json"
            patches.enter_context(mock.patch.object(cli, "HISTORY_PATH", history))
            history.write_text('["previous"]', encoding="utf-8-sig")
            cli.save_history_entry("next command")
            assert cli.load_history() == ["previous", "next command"]
            history.write_bytes(b'{"broken"')
            cli.save_history_entry("must not erase")
            assert history.read_bytes() == b'{"broken"'
            source, target = root / "legacy" / "package", root / "data"
            source.mkdir(parents=True)
            target.mkdir()
            patches.enter_context(mock.patch.object(storage, "PACKAGE_DIR", source))
            patches.enter_context(mock.patch.object(storage, "data_dir", lambda: target))
            (source / "config.json").write_bytes(b'{"legacy":true}')
            assert storage.migrate_from_package_dir(("config.json",)) == ["config.json"]
            (source.parent / "private.txt").write_bytes(b"private")
            assert storage.migrate_from_package_dir(("../private.txt",)) == []
            assert not (root / "private.txt").exists()
            created = target / "created.json"
            assert storage.create_json_if_absent(created, {"first": True}) is True
            saved = created.read_bytes()
            assert storage.create_json_if_absent(created, {"second": True}) is False
            assert created.read_bytes() == saved
        ran = []

        class BadText:
            def __str__(self):
                raise ValueError("unstringifiable target")

        def action(*args):
            ran.append(args)
            return True

        with mock.patch.dict(executor.HANDLERS, {"open_app": action}):
            assert executor.execute_command("1" * 5000) is False
            assert executor.execute_command({"intent": "open_app", "target": BadText(),
                                             "confidence": 1.0}) is False
        assert ran == []
        class Batch:
            def __init__(self, records):
                self.records = records

            def understand(self, text):
                return self.records

        command = {"intent": "chitchat", "target": "tiếng Việt", "confidence": 1, "status": "ok"}
        with mock.patch.object(cli, "execute_command", action):
            output = io.StringIO()
            assert cli.run_once("batch", Batch([command, None]), as_json=True,
                                json_output=output) == 2
            assert json.loads(output.getvalue())["ok"] is False and ran == []
            output = io.StringIO()
            assert cli.run_once("batch", Batch([command]), as_json=True, json_output=output) == 0
            assert output.getvalue().isascii() and json.loads(output.getvalue()) == [command]
            ran.clear()

            class BrokenFlush(io.StringIO):
                def flush(self):
                    raise OSError("simulated output failure")

            assert cli.run_once("batch", Batch([command]), as_json=True,
                                json_output=BrokenFlush()) == 1
            assert ran == []
        with tempfile.TemporaryDirectory() as directory:
            target = pathlib.Path(directory) / "existing.txt"
            target.write_bytes(b"old")
            cancelled = False
            with mock.patch.object(storage.os, "fsync", side_effect=KeyboardInterrupt):
                try:
                    storage.atomic_write_text(target, "new")
                except KeyboardInterrupt:
                    cancelled = True
            assert cancelled and target.read_bytes() == b"old"
            assert [item.name for item in target.parent.iterdir()] == ["existing.txt"]
        print("installed assistant safety and persistence passed")
        PY
    - name: User data must NOT be written into site-packages
      shell: bash
      run: |
        python - <<'PY'
        import pathlib, subprocess, sys, sysconfig
        pkg = pathlib.Path(sysconfig.get_paths()["purelib"]) / "vi_voice_assistant"

        def snapshot(root: pathlib.Path) -> set:
            """Toan bo cay (ten + kich thuoc), tru __pycache__/.pyc.

            Ban cu chi kiem file dinh cap *.json/*.log/*.pkl/*.csv -> mot THU MUC
            moi (voice_cache/) hoac file o cap sau hơn thoát qua mat. Kiem ca cay
            thi khong con lo hổng do.
            """
            out = set()
            for p in root.rglob("*"):
                if "__pycache__" in p.parts or p.suffix == ".pyc":
                    continue
                rel = p.relative_to(root).as_posix()
                out.add((rel, p.stat().st_size) if p.is_file() else (rel, -1))
            return out

        before = snapshot(pkg)
        # Goi ca duong doc (no) vi voice_cache/ chi duoc tao khi doc - dung `--once`
        # khong cham vao no, va day chinh la cho ban cu ghi vao site-packages.
        subprocess.run([sys.executable, "-m", "vi_voice_assistant", "--once", "mở youtube",
                        "--dry-run"], check=True, cwd=str(pathlib.Path.home()))
        # TEN DAY DU `vi_voice_assistant.tts` bat buoc: `import tts` chi chay duoc
        # tu thu muc ma nguon, nen viet ngan thi copy cai dat fail lang le.
        # Import + doc bang gia (that, check=True) - do la duong cham vao thu muc
        # cache; rieng phat tieng duoc boc suppress() vi may CI khong co am thanh
        # va do khong phai dieu buoc nay muon bao ve.
        code = (
            "import contextlib\n"
            "import vi_voice_assistant.tts as t\n"
            "t._load_voice_cache()\n"
            "with contextlib.suppress(Exception):\n"
            "    t.speak('xin chao')\n"
        )
        subprocess.run([sys.executable, "-c", code], check=True,
                       cwd=str(pathlib.Path.home()))
        assert not (pkg / "voice_cache").exists(), (
            "ban cai da tao voice_cache/ trong site-packages - phai di qua data_path()")
        new = snapshot(pkg) - before
        assert not new, f"ban cai da ghi du lieu vao site-packages: {sorted(new)}"
        print("site-packages sach sau khi chay + doc:", len(snapshot(pkg)), "muc")
        PY
    - name: User data must land in the DATA DIR (not a fixed XDG path)
      shell: bash
      working-directory: ${{ runner.temp }}
      run: |
        python - <<'PY'
        # Kiem tra THAT, khong `|| echo ok`. Dung chinh paths.data_path() de lay
        # duong dan - mot hang so `~/.local/share/...` se fail tren Windows/macOS.
        import pathlib
        from vi_voice_assistant.paths import data_path
        missing = [name for name in ("config.json", ".history.json")
                   if not data_path(name).is_file()]
        assert not missing, f"thieu du lieu nguoi dung tai thu muc du lieu: {missing}"
        print("du lieu nam o:", data_path(".history.json").parent)
        PY
    - name: Wheel and sdist must not carry private runtime files
      shell: bash
      run: |
        python -m pip install build
        python -m build
        python - <<'PY'
        import glob, tarfile, zipfile
        from vi_voice_assistant._version import __version__
        wheels = glob.glob(f"dist/vi_voice_assistant-{__version__}-*.whl")
        assert len(wheels) == 1, wheels
        wheel = wheels[0]
        names = zipfile.ZipFile(wheel).namelist()
        bad = [n for n in names if any(k in n for k in
               (".history.json", "reminders.json", "feedback.csv", "lite_model.pkl",
                "intent_model.pkl", "voice_cache/", "logs/", "__pycache__", "/tests/"))]
        assert not bad, f"wheel rò rỉ file runtime/tests: {bad}"
        need = {"vi_voice_assistant/__init__.py", "vi_voice_assistant/__main__.py",
                "vi_voice_assistant/config.json", "vi_voice_assistant/diagnostic.py",
                "vi_voice_assistant/_version.py", "vi_voice_assistant/json_output.py"}
        missing = need - set(names)
        assert not missing, f"wheel thiếu: {missing}"
        print("wheel ok:", len(names), "files")
        with tarfile.open(f"dist/vi_voice_assistant-{__version__}.tar.gz") as archive:
            names = archive.getnames()
        bad = [n for n in names if any(k in n for k in
               (".history.json", "reminders.json", "feedback.csv", ".pkl", "voice_cache/",
                "logs/", "__pycache__"))]
        assert not bad, f"sdist rò rỉ file runtime: {bad}"
        print("sdist ok:", len(names), "entries")
        PY

  # Cai bang script huong dan cua chinh du an (install.py) - kiem tra no khong
  # bao loi khi may khong co pytest va khong mang (chi --check/--dry-run).
  bootstrap:
    name: install.py bootstrap
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Diagnose only (no network needed)
      run: python install.py --check
    - name: Plan without running pip
      run: |
        python install.py --dry-run --profile ml | tee install.log
        grep -q "pip install --upgrade scikit-learn" install.log
        python install.py --offline --skip-tests | tee -a install.log
